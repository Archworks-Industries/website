<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0b0b" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <title>Page not found | Archworks Industries</title>
    <style>
      :root { color-scheme: dark; --jet: #0b0b0b; --sand: #e6e3da; --oxide: #8b1e1e; }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; color: var(--sand); background: var(--jet); font-family: "Helvetica Neue", Arial, sans-serif; }
      main { width: min(90%, 720px); padding: 3rem 0; border-top: 1px solid rgba(230,227,218,.22); border-bottom: 1px solid rgba(230,227,218,.22); }
      p:first-child { color: var(--oxide); font-size: .7rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
      h1 { margin: 1rem 0; font-family: "Arial Narrow", Arial, sans-serif; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: -.04em; line-height: .95; text-transform: uppercase; }
      p { max-width: 540px; color: #c9c5bb; }
      a { display: inline-block; margin-top: 1rem; padding-bottom: .2rem; color: var(--sand); border-bottom: 2px solid var(--oxide); font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-decoration: none; text-transform: uppercase; }
      a:focus-visible { outline: 2px solid var(--sand); outline-offset: 5px; }
    </style>
  </head>
  <body>
    <main>
      <p>404 / Page not found</p>
      <h1>Nothing built here.</h1>
      <p>The address may have changed, or the page may no longer exist.</p>
      <a href="/">Return to Archworks Industries</a>
    </main>
  </body>
</html>
